services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: wilmark, POSTGRES_USER: wilmark, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment: { DATABASE_URL: "postgres://wilmark:${DB_PASSWORD}@db:5432/wilmark" }
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: [media:/app/media, logs:/app/logs]
    restart: unless-stopped
  frontend:
    build: { context: ./frontend, args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8000/api}" } }
    ports: ["80:80"]
    restart: unless-stopped
volumes: { pgdata: {}, media: {}, logs: {} }
